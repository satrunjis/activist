services:
  db:
    image: postgres:16
    container_name: activist-base-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: activist_base
    ports:
      - "5432:5432"
    volumes:
      - activist_base_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activist_base"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  activist_base_pgdata:
