name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: activist_base
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/activist_base?sslmode=disable
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: http://localhost:8080
      SESSION_COOKIE_NAME: __Host-session
      SESSION_IDLE_TTL: "30m"
      SESSION_ABSOLUTE_TTL: "8h"
      LOG_LEVEL: info
      DEV_AUTH_ASSUME_ADMIN: "false"
      DEV_AUTH_ADMIN_LOGIN: admin
      SEED_SUPERUSER_LOGIN: superadmin
      SEED_SUPERUSER_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Run migrations
        working-directory: backend
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.26.0 -dir migrations postgres "$DATABASE_URL" up

      - name: Run tests
        working-directory: backend
        run: go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/satrunjis/activist/backend:latest
            ghcr.io/satrunjis/activist/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend migration image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.migrate
          push: true
          tags: |
            ghcr.io/satrunjis/activist/backend-migrate:latest
            ghcr.io/satrunjis/activist/backend-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
