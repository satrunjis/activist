version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - unparam

formatters:
  enable:
    - goimports

  settings:
    goimports:
      local-prefixes:
        - activist-base

run:
  timeout: 5m
